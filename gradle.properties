android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx3072M -XX:+UseParallelGC
# The Kotlin daemon is a separate JVM. Left uncapped it sizes its heap from
# total RAM and gets killed first when the machine is under memory pressure.
kotlin.daemon.jvmargs=-Xmx2048M

# AGP 8 turns on R8 "full mode" by default. Retrofit 2.9, RxJava 2, ThirtyInch,
# android-state and Apollo 3 all predate it and ship consumer rules that are not
# sufficient for it, so the release build compiles fine and then dies at runtime
# (observed: "Unable to create call adapter for class io.reactivex.Observable").
# Revisit once the Phase 3 dependency modernisation lands.
android.enableR8.fullMode=false
