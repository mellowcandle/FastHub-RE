name: Android CI Workflow

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  debug:
    name: Generate Debug APK
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Generate Release APK
    if: ${{ github.ref_type == 'tag' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode secrets
        env:
          SECRETS_FILE: ${{ secrets.SECRETS_FILE }}
          SECRETS_KEYS: ${{ secrets.SECRETS_KEYS }}
        run: |
          printf '%s' "$SECRETS_FILE" | base64 --decode > app/secrets.properties
          printf '%s' "$SECRETS_KEYS" | base64 --decode > app/keys_release.jks
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "FastHub-RE_${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            "FastHub-RE_${{ github.ref_name }}.apk"
